# The events suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# this jar's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.events.db-kind=h2
quarkus.datasource.events.jdbc.url=jdbc:h2:mem:events;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.events.datasource=events
quarkus.hibernate-orm.events.packages=eu.wohlben.qits.events.entity
quarkus.flyway.events.migrate-at-start=true
quarkus.flyway.events.clean-at-start=true
quarkus.flyway.events.locations=classpath:db/events/migration

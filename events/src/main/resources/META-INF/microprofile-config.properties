# Events config defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored entirely — read by whichever app pulls the jar in, here the
# `service` module. Its own src/main/resources/application.properties sits at 250, `.env` at 295 and
# real environment variables at 300, so a deployment overrides any of these without a rebuild.
#
# This context owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing another service's database or its migration history.
#
# WHERE THE DATABASE COMES FROM. `.config/qits/deployments.yml` carries `resources: postgresql:db`;
# qits-platform-deployments creates the role and the database (`qits_events`, derived from the
# application name) on the tier's postgres before the successor container starts, and injects
#
#     QITS_RESOURCE_DB_URL / QITS_RESOURCE_DB_USERNAME / QITS_RESOURCE_DB_PASSWORD
#
# into it. Those three names are the platform's GENERIC resource contract — nothing about them is
# events-specific, which is the point: the application maps them in its own shipped defaults and the
# deployer stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable, rather than opening some fallback store nobody meant. There is no local file to fall
# back to any more: the store moved off H2 wholesale.
quarkus.datasource.events.db-kind=postgresql
quarkus.datasource.events.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.events.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.events.password=${QITS_RESOURCE_DB_PASSWORD}

# A dedicated persistence unit bound to the events datasource, owning only this module's entities.
# `packages` assigns entity→PU unambiguously; without it an entity in a service with no DEFAULT
# datasource has no unit to belong to and the boot fails naming neither.
quarkus.hibernate-orm.events.datasource=events
quarkus.hibernate-orm.events.packages=eu.wohlben.qits.events.entity

# Own Flyway lineage at a classpath location named after the context, so it can never mix with
# another service's db/migration if the two ever share a jar or a database.
#
# baseline-on-migrate is GONE with the H2 file it existed for. It told Flyway to adopt a non-empty
# schema it had no history table for, which the file being adopted needed; every database this code
# now meets is either empty or was created by this very lineage, and the flag would only mask the
# one case worth failing on — a schema somebody else put there.
quarkus.flyway.events.migrate-at-start=true
quarkus.flyway.events.locations=classpath:db/events/migration

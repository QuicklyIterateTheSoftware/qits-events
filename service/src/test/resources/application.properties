# Test-only overrides. Nothing else belongs here.
#
# Quarkus reads `src/main/resources/application.properties` during tests too and MERGES this file
# over it — the test copy does not shadow the main one, so deleting a key here leaves the shipped
# value in effect. App-level settings (quarkus.rest.path, the non-application root path, the Quinoa
# keys, the OpenAPI info) therefore live in main's copy alone and must NOT be re-declared here: a
# test copy that drifts from the shipped copy makes the suite green about a configuration that never
# ships.
#
# What follows is only what genuinely differs under test.

# A FREE port, not Quarkus' default test port 8081. Two reasons, and the second is not a nicety:
#   - 8081 is the address the platform's own npm registry (qits-artifacts) is published on for a
#     developer on the deployment host — the address qits-spa-events' .npmrc names. So on the one
#     machine this repo is most likely to be built on, the default test port is already bound and
#     the whole suite fails with "Port already bound: 8081: Address already in use", which reads
#     like a code failure and is not one.
#   - even where it is free, @QuarkusTest restarts (a @TestProfile forces one) race each other for
#     it; the siblings carry that as a documented flake and pass test-port=0 to failsafe for exactly
#     this reason. 0 lets the OS pick, and RestAssured is told the real port.
# It is a test-only value, which is why it belongs here and not in main's copy.
quarkus.http.test-port=0

# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container. Its port is chosen at run time, so the url, username and password are not
# written here at all: EmbeddedPgConfigSource (testdb/) supplies them at an ordinal above this file,
# overriding the QITS_RESOURCE_DB_* expressions the events jar ships in
# META-INF/microprofile-config.properties. What is left here is what a file can say.
# clean-at-start wipes the schema between Quarkus restarts, which is what keeps a suite that shares
# one database across classes reproducible.
quarkus.datasource.events.db-kind=postgresql
quarkus.hibernate-orm.events.datasource=events
quarkus.hibernate-orm.events.packages=eu.wohlben.qits.events.entity
quarkus.flyway.events.migrate-at-start=true
quarkus.flyway.events.clean-at-start=true
quarkus.flyway.events.locations=classpath:db/events/migration

# NO DEV SERVICES. The first rule here is that a clone tests green with no docker, and a dev service
# is a container start — which is exactly what an unconfigured postgres datasource invites. The
# config source above always gives this one a url, so nothing should ask; this line is what makes
# "should" into "cannot".
quarkus.devservices.enabled=false

# --- the packaged-artifact ITs ------------------------------------------------------------------
# PackagedSurfaceIT and PackagedLogBridgeIT launch the built artifact as its own process (the
# fast-jar under -DskipITs=false, the native binary under -Dnative), which means it reads main's
# application.properties and the events jar's defaults and NONE of the overrides above — they are
# this JVM's config, not the launched one's. Each hands that process QITS_RESOURCE_DB_URL and its
# two siblings, pointed at a database of its own on this JVM's embedded postgres, so the SHIPPED
# ${QITS_RESOURCE_DB_URL} expression is itself what gets exercised; see the profiles in those
# classes.

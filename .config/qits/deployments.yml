# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# ENVIRONMENT service: every environment runs its own instance, and a green build deploys into
# whichever tier listens to the built branch.
deployment_target: environment

# THE STORE, DECLARED RATHER THAN CONFIGURED. This service's log is PostgreSQL, and the line below
# is what provisions it: a role and a database of its own on the tier's postgres, created before the
# successor container starts and injected as QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD — the
# generic contract the events jar's datasource defaults read verbatim.
#
# The third segment is omitted, so the database is the default derivation: the application name
# minus its `qits-` prefix, dashes to underscores, under a `qits_` prefix — `qits_events`. Spelling
# it out would be a second place for one answer to be wrong in.
#
# Provisioning is idempotent and the credential lives in the deployer's registry, so a redeploy
# finds the existing row and injects the password this process is already connected with.
resources: postgresql:db
